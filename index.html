<div class="wrap" id="app">Loading…</div>

<script>
// One place to ask "what is the engine actually using?". Order matters: what the
// engine reported this run beats what's saved in settings, which beats a fallback.
// Nothing in the UI should restate an engine default anywhere else.
function CFG(key, fallback){
  const echo=(DATA&&DATA.config_echo)||{};
  if(echo[key]!=null) return echo[key];
  if(SET&&SET[key]!=null) return SET[key];
  return fallback;
}
// Karats come from whatever the engine actually priced this run, not a fixed list.
function karats(){
  const p=(DATA&&DATA.prices_per_gram)||{};
  const ks=Object.keys(p);
  return ks.length?ks.sort((a,b)=>parseInt(a)-parseInt(b)):[];
}
const fmt = n => isFinite(n) ? n.toLocaleString("en-US",{style:"currency",currency:"USD"}) : "—";
const fmtK = n => isFinite(n) ? "$"+(n>=1000 ? (n/1000).toFixed(1)+"k" : n.toFixed(0)) : "—";

// ---- persisted sets (per device) ----
const LS = {
  get(k,def){ try{return JSON.parse(localStorage.getItem(k))??def}catch(e){return def} },
  set(k,v){ try{localStorage.setItem(k,JSON.stringify(v))}catch(e){} }
};
let SEEN  = new Set(LS.get("gdd_seen",  []));
let HIDDEN= new Set(LS.get("gdd_hidden",[]));
let SAVED = new Set(LS.get("gdd_saved", []));
let KNOWN = new Set(LS.get("gdd_known", []));   // ids seen on a previous load → for NEW badge

let LASTSEEN = LS.get("gdd_lastseen", {});      // id -> {snap, absent} : last time each deal was live in the feed

function chartHover(el){

  const val=el.getAttribute('data-val'), ts=el.getAttribute('data-ts'), src=el.getAttribute('data-src')||'';
  const vb=svg.getAttribute('viewBox').split(' ').map(Number), W=vb[2],H=vb[3];

  // position tooltip: 3 lines if src present, 2 lines otherwise
  const hasSrc=src.length>0;

  let tx=cx+6; if(tx+tw>W-4) tx=cx-tw-6;

  const tv=document.getElementById(id+'-tv');

}

// Per-query deal counts. Prefers cumulative query_stats.json, but falls back to
// counting the live deals in results.json by their `query` field so the chart still
// works when the Actions cache has been evicted and query_stats resets to empty.
function queryDealData(){
  const qs=(QSTATS&&QSTATS.queries)||(DATA&&DATA.query_perf)||{};
  const cumulative=Object.entries(qs).filter(([,s])=>(s.runs||0)>0);
  if(cumulative.length) return {rows:cumulative, live:false};
  const live={};
  (DATA&&DATA.deals||[]).forEach(d=>{ const q=d.query||""; if(!q) return;
    live[q]=live[q]||{runs:1,deals:0,traps:0,origin:"core"}; live[q].deals++; });
  (DATA&&DATA.traps||[]).forEach(d=>{ const q=d.query||""; if(!q) return;
    live[q]=live[q]||{runs:1,deals:0,traps:0,origin:"core"}; live[q].traps++; });
  return {rows:Object.entries(live), live:true};
}
function queryPerfChart(rows, metric){
  if(!rows||!rows.length) return '<div class="note" style="color:#737373">No per-search data yet. It appears once a sweep returns deals — if this stays empty after a successful run, query_stats.json isn\'t surviving between runs.</div>';
  const total=([,s])=>(s.strong||0)+(s.weak||0)+(s.traps||0) || (s.deals||0)+(s.traps||0);
  const val=([q,s])=>metric==="rate"?(((s.deals||0)/(s.runs||1))):total([q,s]);
  const scored=rows.filter(([,s])=>(s.runs||0)>0);
  const flagged=scored.filter(([q])=>isPinned(q)||isDisabled(q));
  const normal=scored.filter(([q])=>!isPinned(q)&&!isDisabled(q))
                     .sort((a,b)=>val(b)-val(a)).filter(e=>val(e)>0);
  const top=[...flagged.sort((a,b)=>val(b)-val(a)), ...normal].slice(0,18);
  if(!top.length) return '<div class="note" style="color:#737373">Tracked searches exist, but none have returned anything yet.</div>';
  const max=Math.max(0.001,...top.map(val));
  return `<div class="qchart">`+top.map(([q,s])=>{
    const pinned=isPinned(q), disabled=isDisabled(q);
    // legacy rows predate the breakdown: fall back to one undifferentiated deal block
    const strong=s.strong||0, weak=s.weak||0, traps=s.traps||0;
    const plain=(!strong&&!weak)?(s.deals||0):0;
    const t=strong+weak+traps+plain, v=val([q,s]);
    const w=(n)=> t? (n/t)*Math.max(1.5,(v/max)*100) : 0;
    const seg=(n,c,lbl)=> n? `<i class="${c}" style="width:${w(n)}%" title="${n} ${lbl}"></i>`:"";
    const ag=s.ag||0, mixed=s.mixed||0;
    const shown=metric==="rate"?((s.deals||0)/(s.runs||1)).toFixed(2):String(t);
    const note=disabled?"disabled — not searched":pinned?"pinned — always searched":
               s.status==="retired"?"auto-retired (no hits)":s.origin==="explore"?"exploring":"";
    return `<div class="qrow ${disabled?"dim":""}">
      <div class="qlabel" title="${esc(q)}${note?" · "+note:""}">${pinned?'<span class="qflag">★</span>':""}${disabled?'<span class="qflag off">✕</span>':""}${esc(q)}</div>
      <div class="qbar">${seg(strong,"s","strong deals")}${seg(weak,"w","low-score deals")}${seg(plain,"w","deals")}${seg(traps,"t","traps")}</div>
      <div class="qval">${shown}${ag?`<span class="qag" title="${ag} Authenticity Guarantee">🛡${ag}</span>`:""}${mixed?`<span class="qmx" title="${mixed} mixed-karat lots">◆${mixed}</span>`:""}</div>
      <div class="qacts">
        <button class="iact xs ${pinned?"on":""}" title="${pinned?"unpin":"always run this search"}" onclick="toggleQuery('pin','${esc(q).replace(/'/g,"\\'")}')">★</button>
        <button class="iact xs ${disabled?"bad":""}" title="${disabled?"re-enable":"stop using this search"}" onclick="toggleQuery('off','${esc(q).replace(/'/g,"\\'")}')">✕</button>
      </div></div>`;
  }).join("")+`</div>
  <div class="qkey"><span><i class="s"></i>strong (${CFG("strong_score",70)}+)</span><span><i class="w"></i>low score</span><span><i class="t"></i>traps</span><span>🛡 guaranteed</span><span>◆ mixed lot</span></div>`;
}
// Three-way visibility, identical model for every listing trait: show everything,
// show only the ones with it, or hide them. Traps, Authenticity Guarantee and
// mixed-karat lots all behave the same way so there's one thing to learn.
const TRI = [["all","all"],["only","only"],["hide","hide"]];
function triState(key,label){
  return `<div class="fgroup"><span class="flabel">${label}</span>${
    TRI.map(([v,l])=>`<button class="chip ${F[key]===v?"on":""}" onclick="setF('${key}','${v}')">${l}</button>`).join("")}</div>`;

// Authenticity Guarantee has four states, and the difference between them is money.
// "included" is free protection eBay pays for. "optional" is protection you can buy
// at checkout for a fee that has already been charged into this listing's score.
// "none" means no protection is purchasable at any price. "unknown" is our own guess
// from the price band, NOT eBay's word — it is deliberately styled and labelled as
// unconfirmed, because treating a guess as a guarantee is the exact mistake this
// whole feature exists to prevent.
function agInfo(x){
  const st=x.ag_state||(x.auth_guaranteed?"included":"none");
  const fee=x.ag_fee_quoted||x.ag_fee||0;
  if(st==="included") return {k:"included",cls:"ag",txt:"🛡 guaranteed · free",
    tip:"eBay authenticates this before it ships, at no cost to you."};
  if(st==="optional")  return {k:"optional",cls:"agopt",txt:`🛡 +${fmt(fee)} to guarantee`,
    tip:`You can add eBay authentication at checkout for ${fmt(fee)}. That fee is already charged into the score and profit shown.`};
  if(st==="unknown")   return {k:"unknown",cls:"agunk",txt:"🛡? guarantee unconfirmed",
    tip:`This listing's price falls in eBay's optional-authentication band, so protection is probably available for about ${fmt(fee)} — but eBay hasn't confirmed it. Only a detail call can confirm, and this one hasn't had one yet. Treat it as unprotected until confirmed.`};
  return {k:"none",cls:"agno",txt:"⚠ no guarantee available",
    tip:"eBay offers no authentication for this listing at any price. If it isn't solid gold, you carry the whole loss."};
}
function matInfo(x){
  if(x.material!=="suspect") return null;
  const L={component_metal:"⚠ another metal, on a small part",
           tone_ambiguous:"⚠ two-tone — colours or metals?",
           stone_accent:"⚠ accent stones"};
  return {txt:(x.material_tags||[]).map(t=>L[t]||t).join(" · ")||"⚠ check materials",
          tip:x.material_why||"Materials need a look before you commit."};
}
function passTraits(x){
  const m=(mode,has)=> mode==="all" || (mode==="only"&&has) || (mode==="hide"&&!has);
  // "only" now means genuinely protected — free OR buyable. An unconfirmed guess does
  // not count as protected, which is the whole point of tracking the distinction.
  const k=agInfo(x).k, prot=(k==="included"||k==="optional");
  const agOk = F.agMode==="all" || (F.agMode==="only"&&prot) || (F.agMode==="hide"&&!prot)
            || (F.agMode==="free"&&k==="included");
  const sus = x.material==="suspect";
  const matOk = F.matMode==="all" || (F.matMode==="only"&&sus) || (F.matMode==="hide"&&!sus);
  return m(F.trapMode,!!x.trap) && agOk && matOk && m(F.mixedMode,!!x.mixed_lot);
}
// Searches the engine dropped, newest-worst first. Reads the same query_perf the
// Data tab charts, so there's one source of truth for how a term is doing.
function retiredTerms(){
  const qs=(QSTATS&&QSTATS.queries)||(DATA&&DATA.query_perf)||{};
  return Object.entries(qs).filter(([,s])=>s.status==="retired")
              .sort((a,b)=>(a[1].score||0)-(b[1].score||0));
}
function toggleRevive(q){
  q=q.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">");
  const i=REVIVED.indexOf(q);
  if(i>=0) REVIVED.splice(i,1); else REVIVED.push(q);
  SET=SET||{}; SET.revived_queries=REVIVED;
  QDIRTY=true; render(); saveQueryOverrides();
}
function isPinned(q){ return (PINNED||[]).includes(q); }
function isDisabled(q){ return (DISABLED||[]).includes(q); }
function toggleQuery(kind,q){
  q=q.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">");
  const list = kind==="pin"?PINNED:DISABLED, other = kind==="pin"?DISABLED:PINNED;
  const i=list.indexOf(q);
  if(i>=0) list.splice(i,1);
  else { list.push(q); const j=other.indexOf(q); if(j>=0) other.splice(j,1); }  // pin and disable are mutually exclusive
  SET=SET||{}; SET.pinned_queries=PINNED; SET.disabled_queries=DISABLED;
  QDIRTY=true; render();
  saveQueryOverrides();
}
let _qTimer=null;
function saveQueryOverrides(){
  clearTimeout(_qTimer);
  _qTimer=setTimeout(async()=>{
    const ok=await saveSettings(true);
    if(ok){ QDIRTY=false; render(); }
  }, 1500);   // debounce: batch several taps into one commit
}
function listingAge(listed){
  if(!listed) return null;
  const d=new Date(listed); if(isNaN(d)) return null;
  const days=Math.floor((Date.now()-d)/86400000);
  if(days===0) return "today";
  if(days===1) return "1d old";
  if(days<7) return days+"d old";
  if(days<30) return Math.floor(days/7)+"w old";
  return Math.floor(days/30)+"mo old";
}
function nextRun(){
  // derive from the actual last run timestamp so the countdown never desyncs
  // from the real schedule, regardless of what cron interval is set
  if(!DATA||!DATA.updated) return null;
  const last=new Date(DATA.updated);
  if(isNaN(last)) return null;
  // interval: explicit setting wins if set, else measured from the real gaps in
  // history (median of recent runs — same logic as the engine), else 30m bootstrap
  let interval=30;
  if(SET&&SET.runs_per_day>0) interval=Math.round(1440/SET.runs_per_day);
  else if(HIST.length>=6){
    const ts=HIST.slice(-25).map(h=>new Date(h.t).getTime());
    const gaps=ts.slice(1).map((t,i)=>t-ts[i]).filter(g=>g>60e3&&g<6*3600e3).sort((a,b)=>a-b);
    if(gaps.length>=5) interval=Math.round(gaps[Math.floor(gaps.length/2)]/60000);
  }
  const next=new Date(last.getTime()+interval*60000);
  return next > new Date() ? next : new Date(new Date().getTime()+interval*60000);
}
function lastRunStr(){
  if(!DATA||!DATA.updated) return "never";
  const last=new Date(DATA.updated); if(isNaN(last)) return "unknown";
  const mins=Math.floor((Date.now()-last)/60000);
  const ago = mins<1?"just now" : mins<60?`${mins}m ago` : mins<1440?`${Math.floor(mins/60)}h ${mins%60}m ago` : `${Math.floor(mins/1440)}d ago`;
  return `${last.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} · ${ago}`;
}
function countdownStr(){ const t=nextRun(); if(!t) return "—";
  let s=Math.max(0,Math.round((t-new Date())/1000)); const m=Math.floor(s/60); s=s%60;
  return `~${m}m ${String(s).padStart(2,"0")}s`; }

// ---- recently ended (sold) tracking ----
const ENDED_TTL_DAYS = 7;
const ABSENT_RUNS_TO_END = 2;   // must vanish for 2 consecutive HEALTHY loads before we retire it
function endedAge(ts){
  const mins=Math.floor((Date.now()-ts)/60000);
  if(mins<60) return mins<1?"just now":`${mins}m ago`;
  const hrs=Math.floor(mins/60); if(hrs<24) return `${hrs}h ago`;
  const days=Math.floor(hrs/24); return days===1?"1d ago":`${days}d ago`;
}
function reconcileEnded(){
  // 1) purge expired ended entries no matter what
  const cutoff=Date.now()-ENDED_TTL_DAYS*86400000;
  for(const id in ENDED){ if(ENDED[id].endedTs<cutoff) delete ENDED[id]; }

  // 2) never diff against sample/blank data — that path would retire the whole board
  const healthy = DATA && !DATA._sample && Array.isArray(DATA.deals);
  if(!healthy){ persist(); return; }

  const snapOf = x => ({id:x.id,title:x.title,karat:x.karat,grams:x.grams,price:x.price,
    ship:x.ship,profit:x.profit,under_pct:x.under_pct,all_in_per_g:x.all_in_per_g,
    url:x.url,seller_user:x.seller_user||"",score:x.score});

  const live=new Set(DATA.deals.map(x=>x.id).filter(Boolean));
  // guard against a truncated/partial sweep wrongly retiring everything at once
  const prevLive=Object.values(LASTSEEN).filter(r=>(r.absent||0)===0).length;
  const collapsed = prevLive>=8 && live.size < prevLive*0.5;

  // refresh snapshots for everything currently live; a deal that reappears un-ends
  DATA.deals.forEach(x=>{ if(!x.id) return; LASTSEEN[x.id]={snap:snapOf(x),absent:0}; if(ENDED[x.id]) delete ENDED[x.id]; });

  // count absences for tracked ids no longer live; retire after N consecutive healthy misses
  if(!collapsed){
    for(const id in LASTSEEN){
      if(live.has(id)) continue;
      const rec=LASTSEEN[id];
      rec.absent=(rec.absent||0)+1;
      if(rec.absent>=ABSENT_RUNS_TO_END){
        if(!ENDED[id]) ENDED[id]={snap:rec.snap,endedTs:Date.now()};
        delete LASTSEEN[id];   // stop tracking once retired
      }
    }
  }
  persist();
}

async function load(){
  try{ const r=await fetch("results.json",{cache:"no-store"}); if(!r.ok) throw 0; DATA=await r.json(); }
  catch(e){ DATA=SAMPLE; }
  try{ const h=await fetch("history.json",{cache:"no-store"}); HIST=h.ok?await h.json():(DATA._sample?SAMPLE_HIST:[]); }
  catch(e){ HIST=DATA._sample?SAMPLE_HIST:[]; }
  try{ const s=await fetch("settings.json",{cache:"no-store"}); SET=s.ok?await s.json():null; }
  catch(e){ SET=null; }
  PINNED=(SET&&Array.isArray(SET.pinned_queries))?SET.pinned_queries.slice():[];
  DISABLED=(SET&&Array.isArray(SET.disabled_queries))?SET.disabled_queries.slice():[];
  REVIVED=(SET&&Array.isArray(SET.revived_queries))?SET.revived_queries.slice():[];
  try{ const q=await fetch("query_stats.json",{cache:"no-store"}); QSTATS=q.ok?await q.json():null; }
  catch(e){ QSTATS=null; }
  try{ const fb=await fetch("feedback.json",{cache:"no-store"});
    if(fb.ok){ const committed=await fb.json();
      (committed||[]).forEach(e=>{ if(e.id && (!FB[e.id]||((e.ts||0)>=(FB[e.id].ts||0)))) FB[e.id]=e; });
      // drop pending events the repo already has
      const have=new Set((committed||[]).map(e=>e.id+":"+e.ts));
      FB_PENDING=FB_PENDING.filter(e=>!have.has(e.id+":"+e.ts)); persistFB(); }
  }catch(e){}
  if(FB_PENDING.length) scheduleFBFlush();
  if(!SET) SET={payout_pct:DATA.payout_pct||1,trap_under_pct:0.5,min_feedback_pct:96,alert_min_score:70,extra_exclude:[],queries:(DATA.settings_used&&DATA.settings_used.queries)||[]};

  // NEW = current ids not seen on a previous load; then fold them into KNOWN
  const allIds=[...(DATA.deals||[]),...(DATA.traps||[])].map(x=>x.id).filter(Boolean);
  NEW=new Set(allIds.filter(id=>!KNOWN.has(id)));
  allIds.forEach(id=>KNOWN.add(id));
  reconcileEnded();
  persist();
  render();
}

// ---- run planner ----------------------------------------------------------
// Mirrors the engine's own slot ranking so the drawer shows what would actually run,
// not a guess. Anything the engine seats first (pinned, then starved) is seated first
// here too; the rest rank by the same points-per-run score the engine publishes.
function plannedQueries(){
  const perf=(DATA.query_perf)||{}, disabled=new Set(DISABLED||[]);
  const live=Object.entries(perf).filter(([q,s])=>
    !disabled.has(q) && s.status!=="retired" && s.status!=="disabled");
  const pin=[], rest=[];
  live.forEach(e=>((PINNED||[]).includes(e[0])?pin:rest).push(e));
  rest.sort((a,b)=>(b[1].score||0)-(a[1].score||0));
  return {planned:pin.concat(rest), slots:runSlots()};
}
// Slot count from the same budget arithmetic the engine prints, using echoed config
// so the two can't drift apart.
function runSlots(){
  const budget=CFG("daily_call_budget",4500), rpd=(DATA.quota&&DATA.quota.runs_per_day_est)||CFG("runs_per_day",12)||12;
  const reserve=CFG("reserve_runs",2), detail=CFG("max_detail_calls",35);
  const sorts=((DATA.learning&&DATA.learning.sorts)||["price"]).length||1;
  return Math.max(4, Math.floor((budget/(rpd+reserve) - detail - 3)/(sorts*1)));
}
let RUNPICK=null;   // null = run as-is; array = hand-picked one-shot override
function openRunDrawer(){
  const {planned,slots}=plannedQueries();
  RUNPICK=planned.slice(0,slots).map(([q])=>q);
  F.runOpen=true; render();
}
function closeRunDrawer(){ F.runOpen=false; RUNPICK=null; render(); }
function runToggle(q){
  if(!RUNPICK) return;
  const i=RUNPICK.indexOf(q);
  if(i>=0) RUNPICK.splice(i,1); else RUNPICK.push(q);
  render();
}
function runReset(){ const {planned,slots}=plannedQueries();
  RUNPICK=planned.slice(0,slots).map(([q])=>q); render(); }

// Terms you can swap in: everything the engine retired, plus your explore pool,
// minus whatever's already selected.
function benchTerms(){
  const sel=new Set(RUNPICK||[]);
  const ret=retiredTerms().map(([q,s])=>[q,"retired"]);
  const pool=((SET&&SET.explore_pool)||[]).map(q=>[q,"explore pool"]);
  const seen=new Set();
  return ret.concat(pool).filter(([q])=>{
    if(sel.has(q)||seen.has(q)) return false; seen.add(q); return true; });
}

async function runNow(picked){
  const owner=location.hostname.split(".")[0], repo=location.pathname.split("/").filter(Boolean)[0];
  const token=localStorage.getItem("gdd_token");
  if(!token){
    window.open(`https://github.com/${owner}/${repo}/actions/workflows/scout.yml`,"_blank","noopener");
    rmsg("no token saved — opened Actions, click Run workflow there","#fcd34d"); return;
  }
  // A hand-picked run is a one-shot override: write the terms + a fresh id into
  // settings.json first, then dispatch. The engine consumes that id exactly once and
  // goes straight back to normal rotation, so an ad-hoc sweep can't quietly become
  // your permanent query list.
  if(picked && picked.length){
    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    SET=Object.assign({},SET||{},{manual_queries:picked,manual_run_id:id});
    rmsg(`saving ${picked.length} hand-picked term(s)…`);
    const ok=await saveSettingsRaw(SET);
    if(!ok){ rmsg("couldn't save the term list — run not started","#fb7185"); return; }
  }
  const api=`https://api.github.com/repos/${owner}/${repo}/actions/workflows/scout.yml/dispatches`;
  rmsg("starting a run…");
  try{
    const r=await fetch(api,{method:"POST",
      headers:{Authorization:`Bearer ${token}`,Accept:"application/vnd.github+json"},
      body:JSON.stringify({ref:"main"})});
    if(r.status===204){ rmsg("run started — ~2 min, then refresh","#34d399"); F.runOpen=false; render(); }
    else if(r.status===403||r.status===404)
      rmsg(`couldn't start (${r.status}) — your token needs the "workflow" scope, not just public_repo`,"#fb7185");
    else rmsg("couldn't start ("+r.status+")","#fb7185");
  }catch(e){ rmsg("run trigger failed; open Actions manually","#fb7185"); }
}

async function flushFeedback(){
  if(!FB_PENDING.length) return;
  const token=localStorage.getItem("gdd_token");
  if(!token){ fbmsg("feedback saved on this device — add a GitHub token in engine settings so the engine can learn from it"); return; }
  const owner=location.hostname.split(".")[0], repo=location.pathname.split("/").filter(Boolean)[0];
  const api=`https://api.github.com/repos/${owner}/${repo}/contents/feedback.json`;
  const hdr={Authorization:`Bearer ${token}`,Accept:"application/vnd.github+json"};
  try{
    let sha, committed=[];
    const g=await fetch(api+"?ref=main",{headers:hdr});
    if(g.ok){ const j=await g.json(); sha=j.sha;
      try{ committed=JSON.parse(decodeURIComponent(escape(atob((j.content||"").replace(/\n/g,""))))); }catch(e){ committed=[]; } }
    const have=new Set(committed.map(e=>e.id+":"+e.ts));
    const merged=committed.concat(FB_PENDING.filter(e=>!have.has(e.id+":"+e.ts))).slice(-3000);
    const put=await fetch(api,{method:"PUT",headers:hdr,body:JSON.stringify({
      message:`feedback: ${FB_PENDING.length} tap(s) from dashboard`, branch:"main", sha,
      content:btoa(unescape(encodeURIComponent(JSON.stringify(merged,null,1))))})});
    if(put.ok){ FB_PENDING=[]; persistFB(); fbmsg("feedback committed — engine learns next run","#34d399"); }
    else if(put.status===409){ scheduleFBFlush(); }  // raced a scout commit; retry
    else fbmsg("feedback commit failed ("+put.status+") — kept locally, will retry","#fb7185");
  }catch(e){ fbmsg("feedback commit error — kept locally, will retry","#fb7185"); scheduleFBFlush(); }
}

function exportLocal(){
  const dump={_gscout_backup:1, exported:new Date().toISOString(),
    seen:[...SEEN], hidden:[...HIDDEN], saved:[...SAVED], known:[...KNOWN],
    lastseen:LASTSEEN, ended:ENDED, fb:FB, fb_pending:FB_PENDING, ui};
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(dump,null,1)],{type:"application/json"}));
  a.download=`gscout-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  msg("backup downloaded — keep it somewhere safe","#34d399");
}
function importLocal(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
    const d=JSON.parse(rd.result);
    if(!d._gscout_backup) throw new Error("not a GScout backup");
    // merge (union/latest-wins) so restoring an old backup never erases newer activity
    (d.seen||[]).forEach(x=>SEEN.add(x)); (d.hidden||[]).forEach(x=>HIDDEN.add(x));
    (d.saved||[]).forEach(x=>SAVED.add(x)); (d.known||[]).forEach(x=>KNOWN.add(x));
    LASTSEEN=Object.assign({},d.lastseen||{},LASTSEEN);
    ENDED=Object.assign({},d.ended||{},ENDED);
    Object.entries(d.fb||{}).forEach(([id,e])=>{ if(!FB[id]||((e.ts||0)>(FB[id].ts||0))) FB[id]=e; });
    const have=new Set(FB_PENDING.map(e=>e.id+":"+e.ts));
    (d.fb_pending||[]).forEach(e=>{ if(!have.has(e.id+":"+e.ts)) FB_PENDING.push(e); });
    persist(); persistFB(); if(FB_PENDING.length) scheduleFBFlush();
    msg(`restored — ${Object.keys(d.fb||{}).length} ratings, ${(d.saved||[]).length} saved merged in`,"#34d399");
    render();
  }catch(e){ msg("restore failed: "+e.message,"#fb7185"); }
  input.value=""; };
  rd.readAsText(f);
}

// Commit a settings object straight to the repo. saveSettings() reads from the
// Settings panel's inputs, which don't exist unless that tab is mounted — the run
// drawer is reachable from every tab, so it needs a path that doesn't touch the DOM.
async function saveSettingsRaw(obj){
  const token=localStorage.getItem("gdd_token");
  if(!token) return false;
  const owner=location.hostname.split(".")[0], repo=location.pathname.split("/").filter(Boolean)[0];
  if(!owner||!repo) return false;
  const api=`https://api.github.com/repos/${owner}/${repo}/contents/settings.json`;
  const hdr={Authorization:`Bearer ${token}`,Accept:"application/vnd.github+json"};
  try{
    let sha; const g=await fetch(api+"?ref=main",{headers:hdr}); if(g.ok) sha=(await g.json()).sha;
    const put=await fetch(api,{method:"PUT",headers:hdr,body:JSON.stringify({
      message:"one-shot run selection from dashboard",
      content:btoa(unescape(encodeURIComponent(JSON.stringify(obj,null,2)))),sha,branch:"main"})});
    return put.ok;
  }catch(e){ return false; }
}
function qmsg(t,c){ const e=document.getElementById("qmsg"); if(e){ e.textContent=t; e.style.color=c||"#737373"; } }

load();
setInterval(()=>{
  const cd=document.getElementById("cd"); if(cd) cd.textContent=countdownStr();
  const lr=document.getElementById("lr"); if(lr) lr.textContent=lastRunStr();
},1000);
// chart hover — delegated so it works after every render
document.addEventListener('mouseover',e=>{
  const h=e.target.closest('.hit'); if(h) chartHover(h);
});
